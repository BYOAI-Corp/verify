[package]
name = "byoai-chain"
version = "0.1.0"
edition = "2021"
description = "BYOAI receipt and hash-chain core: byte-identical drop-in for the five BYOAI Python formats"
license = "Apache-2.0"
publish = false

[lib]
name = "byoai_chain"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "byoai-chain"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = []
cli = ["dep:rusqlite"]
python = ["dep:pyo3"]
jni = ["dep:jni"]
cabi = []
wasm = ["cabi"]

[dependencies]
sha2 = { version = "0.10", default-features = false }
ed25519-dalek = { version = "2", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
rusqlite = { version = "0.37", features = ["bundled"], optional = true }
jni = { version = "0.21", default-features = false, optional = true }
pyo3 = { version = "0.26", features = ["extension-module", "abi3-py310"], optional = true }

