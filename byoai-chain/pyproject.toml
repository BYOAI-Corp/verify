[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "byoai-chain"
dynamic = ["version"]
description = "BYOAI receipt and hash-chain core (Rust): the five BYOAI Python formats, byte-identical, and the case handoff format"
requires-python = ">=3.10"

[tool.maturin]
features = ["python"]
module-name = "byoai_chain"
