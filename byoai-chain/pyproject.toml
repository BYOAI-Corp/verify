[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "byoai-chain"
version = "0.1.0"
description = "BYOAI receipt and hash-chain core (Rust), byte-identical with the five BYOAI Python formats"
requires-python = ">=3.10"

[tool.maturin]
features = ["python"]
module-name = "byoai_chain"
