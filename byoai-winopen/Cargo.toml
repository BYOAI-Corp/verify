[package]
name = "byoai-winopen"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Windows only: open a file inside a folder the way openat(O_NOFOLLOW) does on Linux, for byoai-chain's --sources reads"
license = "Apache-2.0"
publish = false

# The only unsafe code of the byoai-chain command line lives in this crate: five calls into ntdll
# and kernel32. On other systems the crate is empty.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO"] }
